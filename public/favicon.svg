<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bolsetuGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5B42F3"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#FF5376"/>
    </linearGradient>
    <linearGradient id="bridgeGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF9F1C"/>
      <stop offset="100%" stop-color="#00C4CC"/>
    </linearGradient>
  </defs>
  <!-- Background Pill -->
  <rect width="100" height="100" rx="28" fill="url(#bolsetuGrad)"/>
  
  <!-- Stylized Bridge Arch (Setu) -->
  <path d="M16 74 Q50 36 84 74" fill="none" stroke="url(#bridgeGrad)" stroke-width="6" stroke-linecap="round"/>
  <path d="M26 74 Q50 48 74 74" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="2" stroke-dasharray="4,3"/>

  <!-- Glowing Letter Symbol 'ब' / 'B' -->
  <text x="50" y="56" font-family="'Noto Sans', 'Outfit', sans-serif" font-size="38" font-weight="900" fill="#FFFFFF" text-anchor="middle" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.3))">ब</text>
  
  <!-- Voice Wave Beacon -->
  <circle cx="82" cy="24" r="5" fill="#FF9F1C"/>
  <path d="M76 24 A 10 10 0 0 1 82 16" fill="none" stroke="#FF9F1C" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M72 24 A 16 16 0 0 1 82 10" fill="none" stroke="rgba(255,159,28,0.6)" stroke-width="2" stroke-linecap="round"/>
</svg>